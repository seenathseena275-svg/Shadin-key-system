name: Save Keys

on:
  workflow_dispatch:
    inputs:
      keys:
        description: "Key JSON"
        required: true
        type: string

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save Key.json
        env:
          KEYS_JSON: ${{ inputs.keys }}
        run: |
          printf '%s\n' "$KEYS_JSON" > Key.json

      - name: Commit Key.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Key.json
          git diff --cached --quiet || git commit -m "Update keys"
          git push
